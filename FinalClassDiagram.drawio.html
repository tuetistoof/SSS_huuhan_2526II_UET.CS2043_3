class AuctionConfig {\\n    + startPrice : long\\n    + minIncrement : long\\n    + startTime : LocalDateTime\\n    + endTime : LocalDateTime\\n    + extendSecond : int\\n  }\\n\\n  Entity &amp;lt;|-- User\\n  Entity &amp;lt;|-- Item\\n  Entity &amp;lt;|-- AuctionConfig\\n}\\n\\n&#39; ═══════════════════════════════════════\\n&#39; PACKAGE: common.model.user\\n&#39; ═══════════════════════════════════════\\npackage \\&amp;quot;common.model.user\\&amp;quot; #E1F5EE {\\n\\n  class Admin {\\n  }\\n\\n  class Bidder {\\n    + accountBalance : long\\n    + lockedBalance : long\\n    + getAvailableBalance() : long\\n  }\\n\\n  class Seller {\\n    + bankAccount : String\\n    + accountBalance : long\\n    + pendingBalance : long\\n  }\\n\\n  User &amp;lt;|-- Admin\\n  User &amp;lt;|-- Bidder\\n  User &amp;lt;|-- Seller\\n}\\n\\n&#39; ═══════════════════════════════════════\\n&#39; PACKAGE: common.model.item\\n&#39; ═══════════════════════════════════════\\npackage \\&amp;quot;common.model.item\\&amp;quot; #FAECE7 {\\n\\n  class Art {\\n    + certificate : boolean\\n  }\\n\\n  class Electronic {\\n    + isRepaired : boolean\\n    + warrantyPeriod : int\\n  }\\n\\n  class Vehicle {\\n    + isRepaired : boolean\\n    + warrantyPeriod : int\\n  }\\n\\n  Item &amp;lt;|-- Art\\n  Item &amp;lt;|-- Electronic\\n  Item &amp;lt;|-- Vehicle\\n}\\n\\n&#39; ═══════════════════════════════════════\\n&#39; PACKAGE: common.model.auction\\n&#39; ═══════════════════════════════════════\\npackage \\&amp;quot;common.model.auction\\&amp;quot; #FAEEDA {\\n\\n  class Auction {\\n    - status : AuctionStatus\\n    - sellerId : String\\n    - itemId : String\\n    + commitBid(bid) : void\\n    + placeBid(bid) : void\\n    + start() / finish() / cancel()\\n    + notifyObservers() : void\\n    + snapshot() : AuctionSnapshot\\n  }\\n\\n  class AuctionSnapshot &amp;lt;&amp;lt;immutable&amp;gt;&amp;gt; {\\n    - endTime : LocalDateTime\\n    - status : AuctionStatus\\n    - bidTransactions : List\\n    - version : long\\n    + getLastBidTransaction()\\n    + getBidCount() : int\\n  }\\n\\n  class BidTransaction {\\n    + auctionId : String\\n    + bidderId : String\\n    + bidderUsername : String\\n    + bidAmount : long\\n    + lockedBalance : long\\n    + bidTime : LocalDateTime\\n    + type : BidType\\n  }\\n\\n  Auction *-- AuctionConfig\\n  Auction *-- \\&amp;quot;0..*\\&amp;quot; BidTransaction\\n  Auction ..&amp;gt; AuctionSnapshot : publishes\\n}\\n\\n&#39; ═══════════════════════════════════════\\n&#39; PACKAGE: common.observer\\n&#39; ═══════════════════════════════════════\\npackage \\&amp;quot;common.observer\\&amp;quot; #F1EFE8 {\\n\\n  interface Subject {\\n    + notifyObservers() : void\\n  }\\n\\n  interface Observer {\\n    + update(subject) : void\\n    + getObserverId() : String\\n  }\\n\\n  class ChangeManager &amp;lt;&amp;lt;singleton&amp;gt;&amp;gt; {\\n    - registry : Map&amp;lt;Subject, List&amp;lt;Observer&amp;gt;&amp;gt;\\n    + attach(subject, observer)\\n    + detach(subject, clientId)\\n    + notify(subject)\\n  }\\n\\n  Auction ..|&amp;gt; Subject\\n  ChangeManager o-- \\&amp;quot;0..*\\&amp;quot; Observer\\n  ChangeManager o-- \\&amp;quot;0..*\\&amp;quot; Subject\\n}\\n\\n&#39; ═══════════════════════════════════════\\n&#39; PACKAGE: common.payload\\n&#39; ═══════════════════════════════════════\\npackage \\&amp;quot;common.payload\\&amp;quot; #E6F1FB {\\n\\n  class ClientMessage {\\n    + action : String\\n    + requestId : String\\n    + payload : JsonObject\\n    + type : String\\n  }\\n\\n  class ApiResponse&amp;lt;T&amp;gt; {\\n    + success : boolean\\n    + message : String\\n    + data : T\\n  }\\n\\n  note \\&amp;quot;Request classes:\\\\nLoginRequest, RegisterRequest\\\\nPlaceBidRequest, AutoBidRequest\\\\nCreateAuctionRequest, ItemData\\&amp;quot; as NReq\\n  note \\&amp;quot;DTO classes:\\\\nAuctionDTO, BidDTO, UserDTO\\\\nItemDTO, ArtDTO, VehicleDTO\\\\nNotificationDTO\\&amp;quot; as NDto\\n}\\n\\n&#39; ═══════════════════════════════════════\\n&#39; PACKAGE: server.networking\\n&#39; ═══════════════════════════════════════\\npackage \\&amp;quot;server.networking\\&amp;quot; #E6F1FB {\\n\\n  class AuctionSocketServer {\\n    - workerPool : ExecutorService\\n    + start(port) : void\\n    + setupLogger() : void\\n  }\\n\\n  class ClientHandler &amp;lt;&amp;lt;Runnable&amp;gt;&amp;gt; {\\n    - socket : Socket\\n    - writer : PrintWriter\\n    - userId : String\\n    + run() : void\\n  }\\n\\n  class ClientObserver {\\n    - clientId : String\\n    - writer : PrintWriter\\n    - notifyExecutor : ExecutorService\\n    + update(subject) : void\\n  }\\n\\n  class MessageHandler {\\n    - bidController\\n    - userController\\n    - auctionController\\n    - queryController\\n    - notifController\\n    - adminController\\n    + handle(payload, writer) : void\\n  }\\n\\n  AuctionSocketServer ..&amp;gt; ClientHandler : creates\\n  ClientHandler --&amp;gt; MessageHandler : uses\\n  ClientObserver ..|&amp;gt; Observer\\n}\\n\\n&#39; ═══════════════════════════════════════\\n&#39; PACKAGE: server.controller\\n&#39; ═══════════════════════════════════════\\npackage \\&amp;quot;server.controller\\&amp;quot; #EAF3DE {\\n\\n  class UserController {\\n    + login(request) : ApiResponse\\n    + register(request) : ApiResponse\\n  }\\n\\n  class AuctionController {\\n    + createAuction(request) : ApiResponse\\n    + getAuctions(request) : ApiResponse\\n  }\\n\\n  class BidController {\\n    + placeBid(request) : ApiResponse\\n    + setAutoBid(request) : ApiResponse\\n  }\\n\\n  class QueryController {\\n    + getAuctionDetails(request) : ApiResponse\\n  }\\n\\n  class NotificationController {\\n    + pushToUser(userId, payload)\\n    + broadcast(payload)\\n  }\\n\\n  class AdminController {\\n    + cancelAuction(request) : ApiResponse\\n    + getMetrics() : ApiResponse\\n  }\\n\\n  MessageHandler --&amp;gt; UserController\\n  MessageHandler --&amp;gt; AuctionController\\n  MessageHandler --&amp;gt; BidController\\n  MessageHandler --&amp;gt; QueryController\\n  MessageHandler --&amp;gt; NotificationController\\n  MessageHandler --&amp;gt; AdminController\\n}\\n\\n&#39; ═══════════════════════════════════════\\n&#39; PACKAGE: server.service\\n&#39; ═══════════════════════════════════════\\npackage \\&amp;quot;server.service\\&amp;quot; #FAEEDA {\\n\\n  class UserService {\\n    + authenticate(request) : User\\n    + register(request) : User\\n  }\\n\\n  class AuctionService {\\n    + create(request, sellerId) : Auction\\n    + finish(auctionId) : void\\n  }\\n\\n  class BidService {\\n    + placeBid(request, bidderId) : void\\n  }\\n\\n  class ConcurrentBidManager &amp;lt;&amp;lt;singleton&amp;gt;&amp;gt; {\\n    - bidTaskQueues : Map&amp;lt;String, BlockingQueue&amp;gt;\\n    - workerThreads : Map&amp;lt;String, Thread&amp;gt;\\n    + submitBid(auction, ...) : void\\n  }\\n\\n  class AutoBidService {\\n    - registrationsMap : Map&amp;lt;String, List&amp;gt;\\n    + register(request, bidderId)\\n    + tryTrigger(auctionId)\\n  }\\n\\n  class AntiSnipingService &amp;lt;&amp;lt;utility&amp;gt;&amp;gt; {\\n    + {static} processAntiSniping(config) : LocalDateTime\\n  }\\n\\n  class ItemService {\\n    + createItem(request, sellerId) : Item\\n  }\\n\\n  class NotificationService {\\n    + sendToUser(userId, payload)\\n  }\\n\\n  BidController --&amp;gt; BidService\\n  AuctionController --&amp;gt; AuctionService\\n  UserController --&amp;gt; UserService\\n  BidService --&amp;gt; ConcurrentBidManager\\n  ConcurrentBidManager --&amp;gt; AutoBidService\\n  ConcurrentBidManager ..&amp;gt; AntiSnipingService\\n  AuctionService --&amp;gt; ItemService\\n}\\n\\n&#39; ═══════════════════════════════════════\\n&#39; PACKAGE: server.dao\\n&#39; ═══════════════════════════════════════\\npackage \\&amp;quot;server.dao\\&amp;quot; #F1EFE8 {\\n\\n  abstract class BaseDAO {\\n    # getConnection() : Connection\\n    # safelyRollback(conn)\\n    # closeResource(...)\\n  }\\n\ ══\\n&#39; PACKAGE: server.util\\n&#39; ═══════════════════════════════════════\\npackage \\&amp;quot;server.util\\&amp;quot; #F1EFE8 {\\n\\n  class AuctionRegistry &amp;lt;&amp;lt;singleton&amp;gt;&amp;gt; {\\n    - activeAuctions : Map&amp;lt;String, Auction&amp;gt;\\n    + registerIfAbsent(auction)\\n    + retrieveAndValidateAuction(id) : Auction\\n  }\\n\\n  class SessionRegistry &amp;lt;&amp;lt;singleton&amp;gt;&amp;gt; {\\n    - sessions : Map&amp;lt;String, UserSession&amp;gt;\\n    + register(userId, writer, balance)\\n    + unregister(userId)\\n    + isOnline(userId) : boolean\\n  }\\n\\n  BidService --&amp;gt; AuctionRegistry\\n  ConcurrentBidManager --&amp;gt; AuctionRegistry\\n  BidService --&amp;gt; SessionRegistry\\n  ConcurrentBidManager --&amp;gt; SessionRegistry\\n}\\n\\n&#39; ═══════════════════════════════════════\\n&#39; PACKAGE: client\\n&#39; ═══════════════════════════════════════\\npackage \\&amp;quot;client\\&amp;quot; #E1F5EE {\\n\\n  class ClientApplication {\\n    + start(stage) : void\\n    - canConnect(host, port) : boolean\\n    - startLocalServer(props) : void\\n  }\\n\\n  class AuctionClientSocket &amp;lt;&amp;lt;singleton&amp;gt;&amp;gt; {\\n    - socket : Socket\\n    - pendingRequests : Map\\n    + connect(host, port)\\n    + send(msg) : void\\n    + sendAsync(msg) : CompletableFuture\\n  }\\n\\n  class SocketDispatcher {\\n    + dispatch(message) : void\\n  }\\n\\n  class SessionManager &amp;lt;&amp;lt;singleton&amp;gt;&amp;gt; {\\n    + currentUserId : String\\n    + currentRole : UserRole\\n  }\\n\\n  class SceneManager {\\n    + {static} loginScene : Parent\\n    + {static} switchTo(scene)\\n  }\\n\\n  note \\&amp;quot;JavaFX Controllers:\\\\nLoginSignupController\\\\nBiddingRoomController\\\\nBidderDashboardController\\\\nSellerDashboardController\\\\nAdminDashboardController\\\\nMainLayoutController\\\\nCreateAuctionController\\\\nNotificationController\\\\n+ 6 more row/card controllers\\&amp;quot; as NCtrl\\n\\n  ClientAppl
