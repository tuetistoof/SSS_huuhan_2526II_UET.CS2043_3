# ============================================================
#  Cloud Auction - Client Network Config
#  Mỗi máy client chỉ cần sửa server.host thành IP của máy
#  đang chạy AuctionSocketServer rồi build lại là xong.
# ============================================================

# IP hoặc hostname của máy chạy server
# - Qua Tailscale  → dùng IP Tailscale: 100.67.91.8
# - Chạy local     → giữ nguyên localhost
server.host= 100.67.91.8

# Port Socket của AuctionSocketServer (mặc định 5000, không cần đổi)
server.port=5000